name: Nightly

on:
  schedule:
    # 06:00 UTC every weekday — main's overnight changes are ready by the time the
    # integrations maintainers start their day.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

env:
  # Each run installs into a fresh home: no install id on its Hub and bucket requests.
  DO_NOT_TRACK: "1"

permissions: {}

jobs:
  integrations:
    name: Integration bundles (latest main)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        id: [claude, codex, hermes, pi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: ci

      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      - name: Install protoc and expect
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler expect jq

      - name: Build funes
        run: cargo build --profile ci

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: huggingface/funes-integrations
          path: funes-integrations

      # Twice over: the release users get, resolved through the catalog, then the integrations'
      # main, named with --from. Each is installed into a fresh home and removed unattended — the
      # record funes wrote at install is what lets `remove` run unasked.
      - name: Install and remove the integration, from its release and from main
        env:
          ID: ${{ matrix.id }}
        run: |
          set -eu
          FUNES="$(pwd)/target/ci/funes"
          BUNDLE="$(pwd)/funes-integrations/$ID"
          # Nothing else answers: the catalog, or what --from names.
          unset FUNES_INTEGRATIONS

          for SOURCE in release main; do
            HOME="$(mktemp -d)"
            export HOME
            export FUNES_HOME="$HOME/.funes"
            export HF_HOME="$HOME/.cache/huggingface"

            set -- add "$ID" local
            [ "$SOURCE" = main ] && set -- "$@" --from "$BUNDLE"

            # A release is vouched for and asks nothing; a directory install asks for trust once.
            # Both ask about the first index. A prompt we don't expect times out and fails the job.
            echo "== $ID from $SOURCE =="
            expect -f /dev/stdin -- "$FUNES" "$@" <<'EXPECT'
          set timeout 120
          spawn {*}$argv
          expect {
              -re {Trust it\? \[y/N\] $} { send "y\r"; exp_continue }
              -re {Proceed\? \[Y/n\] $} { send "y\r"; exp_continue }
              -re {\[E/m\] $} { send "\r"; exp_continue }
              eof
          }
          lassign [wait] pid spawn_id os_error status
          exit $status
          EXPECT

            "$FUNES" remove "$ID"
            rm -rf "$HOME"
          done

      # An install a funes from before install records made: the files, a manifest naming no version
      # and the old repository, and no record. A bare add brings it to the catalog's release and
      # records it, asking nothing: the script answers no trust prompt, so one would time out and
      # fail the job. Recorded, it removes unattended.
      - name: Bring an install with no record to the release
        env:
          ID: ${{ matrix.id }}
        run: |
          set -eu
          FUNES="$(pwd)/target/ci/funes"
          unset FUNES_INTEGRATIONS
          HOME="$(mktemp -d)"
          export HOME
          export FUNES_HOME="$HOME/.funes"
          export HF_HOME="$HOME/.cache/huggingface"
          REGISTRY="$HOME/.funes/agents"
          cat > "$HOME/answers.exp" <<'EXPECT'
          set timeout 120
          spawn {*}$argv
          expect {
              -re {Proceed\? \[Y/n\] $} { send "y\r"; exp_continue }
              -re {\[E/m\] $} { send "\r"; exp_continue }
              eof
          }
          lassign [wait] pid spawn_id os_error status
          exit $status
          EXPECT

          echo "== $ID from its release =="
          expect -f "$HOME/answers.exp" -- "$FUNES" add "$ID" local
          RELEASE="$(jq -r .version "$REGISTRY/$ID.json")"
          rm "$REGISTRY/$ID.json"
          jq 'del(.version) | .repo = "huggingface/funes"' "$REGISTRY/$ID/manifest.json" > "$REGISTRY/manifest.tmp"
          mv "$REGISTRY/manifest.tmp" "$REGISTRY/$ID/manifest.json"

          echo "== $ID again, with no record =="
          expect -f "$HOME/answers.exp" -- "$FUNES" add "$ID"
          jq -e --arg release "$RELEASE" '.origin.kind == "catalog" and .version == $release' "$REGISTRY/$ID.json"
          "$FUNES" remove "$ID"
          rm -rf "$HOME"
