name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

permissions: {}

jobs:
  # One leg per OS funes ships on: a run proves only the OS it ran on, the dependencies having
  # per-platform code paths and funes its own (faer on Linux, Accelerate and the metal backend
  # on macOS). macos-15 is the first whose MPSGraph has the fused attention the metal backend
  # needs.
  lint-test:
    permissions:
      contents: read
    name: Lint & Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          # One cache per OS (the key carries it), the Linux one shared with the integration job
          # (same deps under the ci profile) — fewer, smaller caches that survive GitHub's
          # 10 GB/repo limit instead of evicting.
          shared-key: ci

      # Faster, lower-memory linker — keeps the heavy lance link in budget.
      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
        if: runner.os == 'Linux'

      # lance-encoding (via lancedb) compiles protobuf in its build script.
      - name: Install protoc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Format check
        run: cargo fmt --check

      # Both backend variants, so a PR can't leave either failing fmt or a bumped linter — the
      # onnx build/test job below only runs on merges. (fmt is feature-independent: one check
      # covers both; onnx has no OS-specific code, so one OS lints it.)
      - name: Clippy
        run: cargo clippy --all-targets --profile ci -- -D warnings

      - name: Clippy (onnx backend)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --profile ci --no-default-features --features onnx -- -D warnings

      # trufflehog for the secret-scan unit tests, pinned to the version used locally. sudo, so
      # the install dir is writable on both runners.
      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin v3.95.5
          trufflehog --version

      # The weights the unit tests read: the reranker's, for the CPU forward's test against
      # transformers (and on macOS the GPU's), and on macOS the two embedding models' too, for the
      # metal backend's test that it agrees with the CPU forward. One key per OS, since each holds
      # different models. Cached on main only, like the integration job's.
      - name: Restore model weights
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/huggingface/hub/models--BAAI--bge-small-en-v1.5
            ~/.cache/huggingface/hub/models--intfloat--multilingual-e5-small
            ~/.cache/huggingface/hub/models--Alibaba-NLP--gte-reranker-modernbert-base
          key: hf-models-unit-${{ runner.os }}-v1

      # Unit tests only here — hermetic, no network but the weights above. The integration test
      # that runs the real embedder lives in its own job below. --nocapture: the agreement test
      # says in the log whether it ran on the GPU or skipped for want of one.
      - name: Unit tests
        run: cargo test --lib --profile ci -- --nocapture

      - name: Save model weights
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.models.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/huggingface/hub/models--BAAI--bge-small-en-v1.5
            ~/.cache/huggingface/hub/models--intfloat--multilingual-e5-small
            ~/.cache/huggingface/hub/models--Alibaba-NLP--gte-reranker-modernbert-base
          key: hf-models-unit-${{ runner.os }}-v1

  # install.sh ships to Linux and macOS and is plain POSIX sh, so it gets a runner of
  # each: the test fakes the platform detection, but not the BSD vs GNU utilities
  # underneath it. No toolchain here — the script is all this job needs.
  installer-test:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is the runner release.yml builds the darwin asset on.
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer tests
        run: sh scripts/test-install.sh

  # One leg per OS, as above, and gated on nothing: a lint failure is cheaper to see twice than to
  # wait on the other OS's lint for.
  integration-test:
    permissions:
      contents: read
    name: Integration Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      # The push round-trip test awaits one large combined future (embed + Xet upload + lance);
      # it overflows the default ~2 MB test-thread stack under the CI toolchain. Give it headroom.
      RUST_MIN_STACK: "16777216"
      # The tests' Hub and bucket requests are not installs: no install id on them.
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: ci

      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
        if: runner.os == 'Linux'

      # expect drives `funes add` at a pty, so the tests can answer the prompts that are only
      # asked at a terminal. macOS ships it.
      - name: Install protoc and expect
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler expect

      - name: Install protoc
        if: runner.os == 'macOS'
        run: brew install protobuf

      # push's pre-publish secret gate shells out to trufflehog (fail-closed), so the
      # round-trip test below needs the binary on PATH. Pinned to the version used locally.
      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin v3.95.5
          trufflehog --version

      # Embedder/reranker weights for the default (blas) backend (~0.7 GB of safetensors; funes
      # downloads them into the HF cache on first use). Cache on main only — PRs restore main's
      # copy, so there's no duplicate per-PR copy eating the 10 GB cache budget. The files are the
      # same on both OSes, so one key serves both legs.
      - name: Restore model weights
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/huggingface/hub/models--BAAI--bge-small-en-v1.5
            ~/.cache/huggingface/hub/models--Alibaba-NLP--gte-reranker-modernbert-base
          key: hf-models-blas-v2

      # The whole suite, named by nothing: this job has the model cache and the Hub secret, which
      # is everything any test needs, so a test added later is covered without touching this file.
      # The Hub ones skip themselves when the secret is absent (on a fork) and clean up the
      # scratch paths they create.
      - name: Integration tests
        env:
          HF_FUNES_TEST_TOKEN: ${{ secrets.HF_FUNES_TEST_TOKEN }}
        run: cargo test --profile ci -- --nocapture

      - name: Save model weights
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.models.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/huggingface/hub/models--BAAI--bge-small-en-v1.5
            ~/.cache/huggingface/hub/models--Alibaba-NLP--gte-reranker-modernbert-base
          key: hf-models-blas-v2

  # The ONNX backend is an opt-in feature. Its lint runs on every PR (in lint-test above);
  # the build + real-model integration test here run only on merges to main, so pull requests
  # don't spend runners testing a backend they don't change.
  onnx-variant:
    permissions:
      contents: read
    name: ONNX Variant (merge only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 45
    env:
      RUST_MIN_STACK: "16777216"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          # Its own cache: the onnx feature set has different dependency fingerprints than the
          # default jobs' `ci` key, so sharing would evict one to store the other.
          shared-key: ci-onnx

      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # ONNX model files: the embedder in fastembed's own cache, and the reranker's ONNX export in
      # the HF cache, where funes downloads it. This job only runs on main, so save directly on miss.
      - name: Restore ONNX models
        id: onnx
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .fastembed_cache
            ~/.cache/huggingface/hub/models--Alibaba-NLP--gte-reranker-modernbert-base
          key: onnx-models-v1

      - name: Integration test (onnx backend)
        run: cargo test --profile ci --no-default-features --features onnx --test index_recall -- --nocapture

      - name: Save ONNX models
        if: ${{ !cancelled() && steps.onnx.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .fastembed_cache
            ~/.cache/huggingface/hub/models--Alibaba-NLP--gte-reranker-modernbert-base
          key: onnx-models-v1
