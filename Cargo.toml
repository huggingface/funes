[package]
name = "funes"
version = "1.3.3+dev"
edition = "2021"
description = "Recall over your past AI agent sessions — the man who forgets nothing, with discrimination."
license = "Apache-2.0"
repository = "https://github.com/huggingface/funes"

[dependencies]
libc = "0.2"  # geteuid: whose files funes will run
# The `onnx` backend (feature below): embeddings + rerank on the ONNX Runtime. Off by default —
# ort ships prebuilt against glibc 2.38, above the glibc 2.35 floor releases target (Ubuntu 22.04).
fastembed = { version = "5", optional = true }
arrow-array = "58"               # RecordBatch types (must match lance's arrow version)
arrow-schema = "58"              # Schema/Field/DataType for building batches
arrow-select = "58"              # filter_record_batch: drop secret-bearing rows before a push
# huggingface = hf:// reads/writes (Xet-cached).
# 11 and 12 leak an IVF scratch dir per index build; on 13.0.0 drop `sweep_shuffle_leftovers`.
lance = { version = "=11.0.0", default-features = false, features = ["huggingface"] }  # Dataset open/scan/append + create_index, local and over hf://
lance-io = { version = "=11.0.0", default-features = false, features = ["huggingface"] }  # hf:// object store + WrappingObjectStore
lance-index = "=11.0.0"          # FTS/IVF index params + FullTextSearchQuery
lance-linalg = "=11.0.0"         # MetricType for the IVF_PQ index
parquet = "58"                   # read agent-trace datasets stored as parquet (arrow-rs, matches arrow-* = "58")
object_store = "=0.13.2"         # the ObjectStore trait the capture wrapper implements (matches lance-io)
async-trait = "0.1"              # for the ObjectStore impl in src/memory/capture_store.rs
bytes = "1"                      # captured write payloads
chrono = "0.4"                   # recency weighting
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "signal"] }  # sync: OnceCell/Mutex cache the recall models; net/signal: the HTTP server's listener and shutdown
tokio-util = "0.7"               # one token stops the listener and cancels in-flight HTTP requests together
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }  # serve the SDK's Streamable HTTP service
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"                 # canvas for `ask`'s wait animation; re-exports crossterm 0.28
serde = { version = "1", features = ["derive"] }               # MCP request structs
serde_json = { version = "1", features = ["preserve_order"] }  # parse JSONL; preserve tool_use key order
sha1 = "0.10"                    # chunk id = sha1(...)[:16]
sha2 = "0.10"                    # verify release binaries before the installer/updater executes them
hex = "0.4"
walkdir = "2"                    # recursive *.jsonl walk
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io", "schemars", "transport-streamable-http-server"] }  # MCP server; 3.4 can enforce Origin validation
tempfile = "3"                   # temp dir for the pre-publish secret scan; temp files/dirs in tests
hf-hub = { version = "1.0.0-rc.1", features = ["rustls-tls", "blocking"] }  # native create_commit + parent_commit CAS + Xet upload; blocking: model download in the blas backend
# Optional handle on the transitively-pulled openssl-sys (native-tls, via lance).
# The `vendored-openssl` feature builds OpenSSL from source so the aarch64-linux cross-build
# needs no target sysroot. Off by default — native and macOS builds keep their system TLS.
openssl-sys = { version = "0.9", optional = true }
# The `blas` backend (feature below): a from-scratch forward that loads safetensors weights
# and tokenizes itself. macOS runs it on Accelerate, Linux on faer.
tokenizers = { version = "0.22", optional = true }
safetensors = { version = "0.8", optional = true }

# The `blas` backend's Linux seam. Both are pure Rust with runtime CPU dispatch, so release
# binaries stay baseline x86-64/aarch64 yet use AVX2/AVX-512/NEON where the host has them.
[target.'cfg(target_os = "linux")'.dependencies]
faer = { version = "0.24", optional = true, default-features = false, features = ["std", "rayon"] }  # GEMM ("std" pulls its fast x86 kernels)
multiversion = { version = "0.8", optional = true }  # per-CPU clones of the vectorized exp

[features]
default = ["blas"]
vendored-openssl = ["openssl-sys/vendored"]
# BLAS inference backend (src/inference/blas.rs), the default: macOS wires it to Accelerate (see build.rs),
# Linux to faer + a polynomial exp.
blas = ["dep:tokenizers", "dep:safetensors", "dep:faer", "dep:multiversion"]
# ONNX inference backend (fastembed/ort). When both backends are compiled in, `blas` is the one
# funes runs; the ONNX types are the reference backend for bench_backends.
onnx = ["dep:fastembed"]

[dev-dependencies]
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }  # drive the HTTP server as a real client
tokio = { version = "1", features = ["process"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }  # requests an SDK client never sends: a foreign Host or Origin

# Benchmarks live under benchmark/ alongside their README; run via `cargo run --example <name>`.
[[example]]
name = "bench_recall"
path = "benchmark/bench_recall.rs"

[[example]]
name = "bench_index"
path = "benchmark/bench_index.rs"

# A/B the inference backends (BLAS vs ONNX as reference). Needs both compiled in:
#   cargo run --release --features onnx --example bench_backends
[[example]]
name = "bench_backends"
path = "benchmark/bench_backends.rs"

# One-off backfill of the `repo` column (local: add_columns; remote: add_columns via a guarded
# commit). Delete both, and `memory::remote::add_column`, once every store carries `repo`.
[[example]]
name = "backfill_repo"
path = "scripts/backfill_repo.rs"

[[example]]
name = "backfill_remote_repo"
path = "scripts/backfill_remote_repo.rs"

[profile.release]
opt-level = 3

# Distribution profile — what the release workflow publishes. thin LTO gives cross-crate
# dead-code elimination (funes links the full lance/DataFusion and arrow stacks but
# exercises a narrow slice of each) and strip drops the symbol table, while fitting a 16 GiB CI
# runner — fat LTO with one codegen unit merges the whole graph into a single module and gets the
# build killed there mid-link. The LTO pass is uncacheable, so it runs only for published builds —
# everyday `cargo build --release` keeps the fast profile above.
[profile.dist]
inherits = "release"
lto = "thin"
strip = "symbols"

# CI build profile. Keeps line numbers for our own code so test backtraces stay useful, but strips debuginfo
# from dependencies so linking doesn't exhaust the runner's disk.
# Workspace keeps debug-assertions (inherited from dev); only deps drop them.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.ci.package."*"]
debug = false
debug-assertions = false
strip = "debuginfo"
